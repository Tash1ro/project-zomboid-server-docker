version: "3.7"
services:
  ProjectZomboidDedicatedServer:
    image: danixu86/project-zomboid-dedicated-server:latest
    restart: unless-stopped
    env_file:
      - stack.env
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
      - "8766:8766/udp"
      - "8767:8767/udp"
    volumes:
      # Server data
      - ${PROJECT_ZOMBOID_DATA:-./data}:/home/steam/Zomboid
      # Workshop mods folder
      - ${PROJECT_ZOMBOID_WORKSHOP_MODS:-./workshop-mods}:/home/steam/pz-dedicated/steamapps/workshop
      # Panel support
      - pz-install:/home/steam/pz-dedicated
    networks:
      - zomboid-net
      
volumes:
  pz-install:

networks:
  zomboid-net:
    external: true
